<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simulate the NodeMCU</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
</head>
<body style="background-color: snow;">
    <h2>Teachers</h2>   
    <table class="table table-bordered"> 
        <thead class="thead-dark">
            <tr>
                <th scope="col">Name: </th>
                <th scope="col">Mark: </th> 
            </tr> 
        </thead>              
        {% for teacher in teachers %}
            <tr>
                <td>{{teacher.name}}</td>
                <td><a href="http://127.0.0.1:8000/mark/?rfid={{teacher.rfid}}" onclick="mark()">Mark Attendance</a></td>
            </tr>
        {% endfor %}        
    </table>
    <br/>
    <h2>Students</h2>   
    <table class="table table-bordered">
        <thead class="thead-dark">
            <tr>
                <th scope="col">Name: </th>
                <th scope="col">Mark: </th> 
            </tr> 
        </thead>
        {% for student in students %}
            <tr>
                <td>{{student.name}}</td>
                <td><a href="http://127.0.0.1:8000/mark/?rfid={{student.rfid}}" onclick="mark()">Mark Attendance</a></td>
            </tr>
        {% endfor %}
    </table>
</body>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>

<script>
    function mark(){
    event.preventDefault();
    //console.log(event.target.href);
    fetch(event.target.href, {method: "GET"}).then(() => {
        console.log("Attendance marked");
    });
    }
</script>
</html>
