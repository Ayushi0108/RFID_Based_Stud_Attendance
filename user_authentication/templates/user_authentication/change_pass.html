{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Change Password</title>
    <link rel="stylesheet" href="{% static 'user_authentication/cpstyle.css' %}">
  </head>
  <body>
    <section>
        <div class="login-box">
            <form action="{% url 'change_pass' %}" method="post">
                {% csrf_token %}
                <h2>Change Password</h2>
                <div class="input-box">
                    <span class = "icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input name="old_pass_field" type="password" required >
                    <label >Old Password</label>
                </div>
                <!-- otp varification shayad nahi rakhna hai islye nahi karra -->
                <div class="input-box">
                    <span class = "icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input name="new_pass_field_1" type="password" required >
                    <label >New Password</label>
                </div>
                <div class="input-box">
                    <span class = "icon"><ion-icon name="lock-closed-outline"></ion-icon></span>
                    <input name="new_pass_field_2" type="password" required >
                    <label >Confirm Password</label>
                    
                </div>
                <button type="submit">Submit</button>
                <a href="{% url 'login' %}" style="

                position: relative;
                top:10px;                
                color: white;
                align-items: center;
                text-decoration:none;
                left:39%;
                text-align: center;
                ">Home page</a>
                <!-- <div style="position: relative; display:flex; top: 15px;
                    left: 24%;

                    font-size: larger;
                ">
                    {% for m in messages %}
                        {% if m.tags == "success" %}
                            <p style="color:rgb(156, 206, 140);
                            text-shadow: 0 0 4px #00FF00, 0 0 5px #0000FF;
                            ">{{m}}</p>
                        {% else %}
                            <p style="color:rgb(223, 179, 179);
                            text-shadow: 0 0 4px #FF0000, 0 0 5px #0000FF;
                            ">{{m}}</p>
                        {% endif %}
                    {% endfor %}
                </div> -->
                
            </form>
        </div>
    </section>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
<script no  module src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
{%if message %}
<script type="text/javascript" data-messages="{{message}}">
    const data = document.currentScript.dataset;
    var arr = data.messages;
        alert(arr);
</script>
{% endif %}
</body>
</html>
